<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141516" />
    <script>
      // Apply the saved theme before first paint (see src/app/theme.ts).
      try {
        if (localStorage.getItem('virtual-wardrobe:theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name=theme-color]').content = '#f1efea';
        }
      } catch {}
    </script>
    <title>Virtual Wardrobe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
